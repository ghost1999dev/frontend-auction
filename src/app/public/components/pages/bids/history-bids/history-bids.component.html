<div class="card">
    <div class="flex justify-content-between align-items-center mb-4">
        <h1>Historial de ofertas de la subasta #{{auctionId}}</h1>
        <div class="flex gap-3">
            <span class="p-input-icon-left">
                <i class="pi pi-search"></i>
                <input pInputText type="text" placeholder="Buscar ofertas..." 
                       (input)="onGlobalFilter(dt, $event)"/>
            </span>
            <p-dropdown [options]="statusOptions" [(ngModel)]="selectedStatus" 
                      optionLabel="label" optionValue="value" placeholder="Filtrar por estado"
                      (onChange)="filterBids()" [showClear]="true" class="w-full md:w-14rem">
            </p-dropdown>
        </div>
    </div>

    <p-table #dt [value]="filteredBids" [loading]="loading" responsiveLayout="scroll" [rows]="10" 
            [globalFilterFields]="['developer_profile.user.name','amount']" [paginator]="true" 
            [rowsPerPageOptions]="[5,10,20]" [showCurrentPageReport]="true" 
            currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} entradas" 
            [rowHover]="true" dataKey="id">
        <ng-template pTemplate="header">
            <tr>
                <th pSortableColumn="developer_profile.user.name">Desarrollador <p-sortIcon field="developer_profile.user.name"></p-sortIcon></th>
                <th pSortableColumn="amount">Monto <p-sortIcon field="amount"></p-sortIcon></th>
                <th pSortableColumn="status">Estado <p-sortIcon field="status"></p-sortIcon></th>
                <th pSortableColumn="createdAt">Fecha <p-sortIcon field="createdAt"></p-sortIcon></th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-bid>
            <tr>
                <td>
                    <div class="flex align-items-center gap-2">
                        <img [src]="bid.developer_profile?.user?.image || 'assets/images/default-user.jpg'" 
                             alt="User image" class="w-2rem h-2rem border-round" style="object-fit: cover"/>
                        <span>{{bid.developer_profile?.user?.name || 'Desconocido'}}</span>
                    </div>
                </td>
                <td>
                    <span class="font-bold">{{bid.amount | currency:'USD':'symbol':'1.2-2'}}</span>
                </td>
                <td>
                    <p-tag [severity]="getStatusSeverity(bid.status || 0)" 
                           [value]="getStatusLabel(bid.status || 0)"></p-tag>
                </td>
                <td>
                    {{bid.createdAt | date:'shortDate'}}
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="empty">
            <tr>
                <td colspan="4" class="text-center py-5">
                    <p class="text-500">No hay ofertas para esta subasta</p>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
